# 生产部署编排:postgres + redis + app(后端托管前端)
# 与 backend/docker-compose.yml(仅开发基础设施)相互独立。
#
# 配置复用 backend/.env(通过 env_file 注入,无需在根目录新建 .env)。
# 首次部署前必须从 backend/.env.example 复制并填写数据库密码、JWT 密钥
# 以及所选模型供应方的 API Key。业务数据保存在命名卷中，不进入镜像。
name: physics-lab

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: physics-lab-postgres
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # PostgreSQL 用户、密码和数据库名均由 backend/.env 注入。
      TZ: Asia/Shanghai
    volumes:
      - physics_lab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - physics_lab_network

  redis:
    image: redis:7-alpine
    container_name: physics-lab-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    environment:
      TZ: Asia/Shanghai
    volumes:
      - physics_lab_redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - physics_lab_network

  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: physics-lab-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      # 仅覆盖容器内部服务地址；账号、数据库名和模型配置沿用 backend/.env。
      APP_ENV: production
      TZ: Asia/Shanghai
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks:
      - physics_lab_network

volumes:
  physics_lab_postgres_data:
  physics_lab_redis_data:

networks:
  physics_lab_network:
    driver: bridge
